<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register new user</title>
</head>
<body>
<form th:action="@{/api/v1/users}" method="post" th:object="${userRequestDto}">
    <label>First name: <input type="text" th:field="*{firstName}"/></label>
    <label>Lst name: <input type="text" th:field="*{lastName}"/></label>
    <label>Username: <input type="text" th:field="*{username}"/></label>
    <label>Password: <input type="text" th:field="*{password}"/></label>
    <button type="submit"> Register</button>

</form>

</body>
</html>
